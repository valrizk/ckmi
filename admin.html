<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>

  <div class="container py-5" style="max-width: 650px;">
    
    <!-- BOX LOGIN -->
    <div id="loginBox" class="bento-card p-4">
      <h4 class="fw-bold mb-3 text-white text-center">Login Admin</h4>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label text-muted small">Username</label>
          <input type="text" id="adminUser" class="form-control search-input-bento" required autocomplete="off">
        </div>
        <div class="mb-3">
          <label class="form-label text-muted small">Password</label>
          <input type="password" id="adminPass" class="form-control search-input-bento" required>
        </div>
        <button type="submit" class="btn btn-aurora w-100 py-2">Masuk Panel</button>
      </form>
    </div>

    <!-- BOX INPUT APK -->
    <div id="adminContent" class="bento-card p-4 d-none">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0 text-white">Tambah APK Baru</h4>
        <button id="btnLogout" class="btn btn-outline-danger btn-sm rounded-3">Logout</button>
      </div>
      
            <!-- DAFTAR KELOLA / HAPUS APK -->
      <div class="vriz-card p-4 mt-4">
        <h2 class="h6 fw-bold text-white mb-3">Daftar APK Tersimpan</h2>
        <div id="adminAppList" class="d-flex flex-column gap-2">
          <div class="text-secondary small text-center py-3">Memuat daftar...</div>
        </div>
      </div>


      <form id="addAppForm">
        <div class="mb-3">
          <label class="form-label text-muted small">Nama Aplikasi / Game</label>
          <input type="text" id="title" class="form-control search-input-bento" required>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label text-muted small">Kategori</label>
            <select id="category" class="form-select search-input-bento">
              <option value="Games">Games</option>
              <option value="Apps">Apps</option>
              <option value="Tools">Tools</option>
              <option value="Productivity">Productivity</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted small">Versi</label>
            <input type="text" id="version" class="form-control search-input-bento" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label text-muted small">Ukuran File</label>
            <input type="text" id="size" class="form-control search-input-bento" required>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted small">Info MOD</label>
            <input type="text" id="mod_info" class="form-control search-input-bento" placeholder="Unlimited Money">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-muted small">URL Icon / Logo APK</label>
          <input type="url" id="icon_url" class="form-control search-input-bento" required>
        </div>

        <div class="mb-3">
          <label class="form-label text-muted small">URL Download File</label>
          <input type="url" id="download_url" class="form-control search-input-bento" required>
        </div>

        <div class="mb-4">
          <label class="form-label text-muted small">Deskripsi</label>
          <textarea id="description" class="form-control search-input-bento" rows="3"></textarea>
        </div>

        <button type="submit" id="btnSubmit" class="btn btn-aurora w-100 py-2">Simpan Data APK</button>
      </form>
    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
