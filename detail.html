<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#151821"
  >

  <meta
    name="description"
    content="Detail aplikasi dan informasi berkas — Vrizmods."
  >

  <title>Detail Aplikasi - Vrizmods</title>

  <link
    rel="icon"
    type="image/x-icon"
    href="/media/favico.ico"
  >

  <!-- =========================================================
       GOOGLE FONTS
       ========================================================= -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- =========================================================
       BOOTSTRAP
       ========================================================= -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >


  <!-- =========================================================
       VRIZMODS CUSTOM UI
       ========================================================= -->
  <link
    rel="stylesheet"
    href="/css/custom.css"
  >

</head>


<body>


  <!-- =========================================================
       HEADER
       ========================================================= -->
  <header class="vriz-navbar py-2 px-3 sticky-top">

    <div class="container-fluid max-w-lg">

      <div class="d-flex align-items-center justify-content-between">


        <!-- LEFT -->
        <div class="d-flex align-items-center gap-2">


          <!-- BACK BUTTON -->
          <a
            href="/"
            class="btn-icon text-decoration-none"
            aria-label="Kembali ke Beranda"
          >

            <svg
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <path
                d="M15 19l-7-7 7-7"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>

            </svg>

          </a>


          <!-- BRAND -->
          <a
            href="/"
            class="vriz-brand ms-1 text-decoration-none"
            aria-label="Vrizmods Beranda"
          >
            Vriz<span>mods</span>
          </a>

        </div>


        <!-- RIGHT LOGO -->
        <a
          href="/"
          aria-label="Vrizmods"
        >

          <img
            src="/media/logo.png"
            alt="Vrizmods"
            class="vriz-logo-header"
            onerror="this.style.display='none';"
          >

        </a>

      </div>

    </div>

  </header>



  <!-- =========================================================
       MAIN
       ========================================================= -->
  <main class="container-fluid max-w-lg px-3 py-4">


    <!-- =======================================================
         PAGE LABEL
         ======================================================= -->
    <div class="detail-page-label mb-3">

      <span class="small text-secondary">
        Detail aplikasi
      </span>

    </div>



    <!-- =======================================================
         APP HEADER
         ======================================================= -->
    <section
      class="vriz-card p-3 p-md-4 mb-3"
      id="appHeader"
      aria-label="Informasi aplikasi"
    >

      <!--
        Konten aplikasi akan di-render
        oleh /js/app.js
      -->

      <div class="d-flex align-items-center gap-3">

        <div
          class="spinner-border spinner-border-sm text-indigo"
          role="status"
          aria-label="Memuat"
        ></div>

        <span class="text-secondary small">
          Memuat rincian berkas...
        </span>

      </div>

    </section>



    <!-- =======================================================
         DOWNLOAD CARD
         ======================================================= -->
    <section
      class="vriz-card p-3 p-md-4 mb-3"
      aria-labelledby="downloadTitle"
    >

      <div class="text-center">


        <!-- DOWNLOAD ICON -->
        <div class="detail-download-icon mx-auto mb-3">

          <svg
            width="24"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="M12 3v12"
              stroke-linecap="round"
            ></path>

            <path
              d="M7 10l5 5 5-5"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></path>

            <path
              d="M5 21h14"
              stroke-linecap="round"
            ></path>

          </svg>

        </div>


        <h2
          id="downloadTitle"
          class="h6 fw-bold text-white mb-2"
        >
          Unduh Berkas APK
        </h2>


        <p class="text-secondary small mb-3">
          Siapkan berkas aplikasi untuk diunduh.
        </p>


        <!-- DOWNLOAD AREA -->
        <div
          id="downloadArea"
          class="w-100"
        >

          <button
            id="btnStartDownload"
            type="button"
            class="btn-card-action w-100 py-3 fs-6 fw-bold"
            style="
              background: var(--accent-primary);
              border-color: var(--accent-primary);
              color: #fff;
            "
          >
            Mulai Pengunduhan
          </button>

        </div>


      </div>

    </section>



    <!-- =======================================================
         DESCRIPTION
         ======================================================= -->
    <section
      class="vriz-card p-3 p-md-4 mb-4"
      aria-labelledby="descriptionTitle"
    >

      <div class="d-flex align-items-center justify-content-between gap-3 mb-3">

        <div>

          <span class="small text-secondary d-block mb-1">
            Informasi
          </span>

          <h2
            id="descriptionTitle"
            class="section-title mb-0"
          >
            Deskripsi & Informasi Berkas
          </h2>

        </div>


        <!-- INFO ICON -->
        <div class="detail-info-icon">

          <svg
            width="19"
            height="19"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <circle
              cx="12"
              cy="12"
              r="9"
            ></circle>

            <path
              d="M12 11v5"
              stroke-linecap="round"
            ></path>

            <path
              d="M12 8h.01"
              stroke-linecap="round"
            ></path>

          </svg>

        </div>

      </div>


      <!-- APP DESCRIPTION -->
      <div
        id="appDescription"
        class="text-muted small lh-lg"
        style="
          white-space: pre-line;
          color: var(--text-muted) !important;
        "
      >
        -
      </div>

    </section>


  </main>



  <!-- =========================================================
       BOOTSTRAP JS
       ========================================================= -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


  <!-- =========================================================
       VRIZMODS APPLICATION LOGIC
       Jangan diubah
       ========================================================= -->
  <script src="/js/app.js"></script>


</body>

</html>
